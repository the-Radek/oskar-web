name: Main CI

on:
  push:
    paths-ignore:
      - 'wiki/**'
      - 'harvester/**'
      - 'README.md'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login hub.vecernikovi.cz -u github --password-stdin

      - name: Build and push
        run: |
          docker build -t hub.vecernikovi.cz/oskar/web:latest .
          docker push hub.vecernikovi.cz/oskar/web:latest
