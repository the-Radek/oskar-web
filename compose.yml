services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: oskar
      POSTGRES_USER: oskar
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      PGDATA: /var/lib/postgresql/data
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oskar -d oskar"]
      interval: 60s
      timeout: 30s
      retries: 5
    volumes:
      - dbdata:/var/lib/postgresql/data

  web:
    build: .
    restart: always
    init: true
    depends_on:
      - db
    environment:
      NAMESPACE: oskar
      DB_HOST: db
      DB_DATABASE: oskar
      DB_USERNAME: oskar
      DB_PASSWORD_FILE: /run/secrets/db_password
      GOOGLE_SECRET_FILE: /run/secrets/google_secret
    secrets:
      - db_password
      - google_secret
    # Swarm ignores 127.0.0.1 and publishes on all interfaces;
    # external access is blocked by DOCKER-USER rules in /etc/ufw/after.rules
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - gallery:/app/public/galerie
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback

secrets:
  db_password:
    file: '${DB_PASSWORD_FILE:-./secrets/db_password}'
  google_secret:
    file: '${GOOGLE_SECRET_FILE:-./secrets/google_secret}'
volumes:
  dbdata:
  gallery:
