
services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: oskar
      POSTGRES_USER: oskar
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      PGDATA: /var/lib/postgresql/data
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "oskar"]
      interval: 60s
      timeout: 30s
      retries: 5
    volumes:
      - dbdata:/var/lib/postgresql/data

  adminer:
    image: ghcr.io/shyim/adminerevo
    restart: always
    stop_signal: SIGKILL
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_DRIVER: pgsql
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DEFAULT_DB: oskar
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - adminer:/tmp

  web:
    build: .
    restart: always
    init: true
    depends_on:
      - db
    environment:
      NAMESPACE: oskar
      DB_HOST: db
      DB_DATABASE: oskar
      DB_USERNAME: oskar
      DB_PASSWORD_FILE: /run/secrets/db_password
      GOOGLE_SECRET_FILE: /run/secrets/google_secret
    secrets:
      - db_password
      - google_secret
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - gallery:/app/public/galerie

secrets:
  db_password:
    file: '${DB_PASSWORD_FILE:-./secrets/db_password}'
  google_secret:
    file: '${GOOGLE_SECRET_FILE:-./secrets/google_secret}'
volumes:
  dbdata:
  adminer:
  gallery:
